<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPD School Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #4f46e5;
    --primary-dark: #3730a3;
    --primary-light: #eef2ff;
    --surface: #ffffff;
    --background: #f4f6fd;
    --text: #1e2433;
    --muted: #6b7590;
    --border: #e4e8f5;
    --success: #15803d;
    --success-bg: #dcfce7;
    --danger: #dc2626;
    --danger-bg: #fee2e2;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 9px;
    --shadow: 0 14px 34px -14px rgba(67,56,202,.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Prompt', 'Sarabun', 'Segoe UI', system-ui, sans-serif;
    background: var(--background);
    color: var(--text);
  }
  header {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff; padding: 12px 22px;
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
    box-shadow: 0 6px 18px -8px rgba(55,47,158,.45);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-badge {
    width: 34px; height: 34px; border-radius: 10px; background: #fff;
    display: flex; align-items: center; justify-content: center; padding: 3px;
    box-shadow: 0 3px 10px -3px rgba(0,0,0,.35); flex-shrink: 0;
  }
  .brand-badge img { width: 100%; height: 100%; object-fit: contain; }
  header h1 { font-size: 16px; font-weight: 600; letter-spacing: .2px; }
  header .who { font-size: 12.5px; opacity: .92; }
  header .who-wrap { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  header button.link {
    background: rgba(255,255,255,.16); border: none; color: #fff;
    padding: 7px 13px; border-radius: var(--radius-sm); font-size: 12px; cursor: pointer;
    font-family: inherit; font-weight: 500; transition: background .15s;
  }
  header button.link:hover { background: rgba(255,255,255,.28); }

  nav { display: flex; gap: 6px; padding: 10px 22px; background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap; position: sticky; top: 0; z-index: 10; }
  nav button {
    border: none; background: var(--primary-light); color: var(--primary-dark); padding: 9px 16px;
    border-radius: 999px; font-size: 13px; cursor: pointer; font-weight: 600; font-family: inherit;
    transition: background .15s, color .15s;
  }
  nav button:hover { background: #e0e0fc; }
  nav button.active { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; box-shadow: 0 4px 12px -4px rgba(79,70,229,.55); }

  main { max-width: 900px; margin: 0 auto; padding: 22px 18px 60px; }
  .pane { display: none; }
  .pane.active { display: block; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 18px; box-shadow: var(--shadow); }
  .card h2 { font-size: 14.5px; font-weight: 600; margin-bottom: 14px; color: var(--text); }

  label { display: block; font-size: 12.5px; font-weight: 500; color: var(--muted); margin: 12px 0 5px; }
  input, select {
    width: 100%; padding: 10px 13px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    font-size: 14px; font-family: inherit; transition: border-color .15s, box-shadow .15s; background: #fff; color: var(--text);
  }
  input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-light); }

  button.primary {
    margin-top: 16px; margin-right: 8px; background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff; border: none; padding: 11px 18px; border-radius: var(--radius-sm); font-weight: 600;
    font-size: 14px; font-family: inherit; cursor: pointer; box-shadow: 0 6px 16px -6px rgba(79,70,229,.5);
    transition: transform .1s;
  }
  button.primary:hover:not(:disabled) { transform: translateY(-1px); }
  button.primary:disabled { opacity: .6; cursor: default; box-shadow: none; }
  button.primary.danger { background: linear-gradient(135deg, #ef4444, #b91c1c); box-shadow: 0 6px 16px -6px rgba(220,38,38,.5); }
  button.primary.muted { background: #94a3b8; box-shadow: none; }

  .msg { font-size: 13px; margin-top: 10px; min-height: 18px; font-weight: 500; }
  .msg.error { color: var(--danger); }
  .msg.success { color: var(--success); }

  .result-row {
    padding: 11px 4px; border-bottom: 1px solid #f1f1fb; display: flex; align-items: center;
    justify-content: space-between; gap: 10px; cursor: pointer; border-radius: var(--radius-sm);
    transition: background .12s;
  }
  .result-row:last-child { border-bottom: none; }
  .result-row:hover { background: var(--primary-light); }
  .result-name-wrap { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%; background: var(--primary-light); color: var(--primary-dark);
    display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0;
  }
  .result-name { font-size: 13.5px; font-weight: 500; }
  .result-sub { font-size: 11.5px; color: var(--muted); }
  .result-amount { font-weight: 700; font-size: 13.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .empty-hint { color: var(--muted); font-size: 13px; padding: 6px 2px; }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .badge.open { background: var(--success-bg); color: var(--success); }
  .badge.closed { background: var(--danger-bg); color: var(--danger); }
  .badge.role { background: var(--primary-light); color: var(--primary-dark); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 9px 8px; border-bottom: 1.5px solid var(--border); color: var(--muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .3px; }
  td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #f1f1fb; }
  tr:last-child td { border-bottom: none; }

  .stat-tile {
    background: var(--primary-light); border-radius: var(--radius-md); padding: 14px 16px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .stat-tile .stat-label { font-size: 11.5px; color: var(--primary-dark); font-weight: 600; }
  .stat-tile .stat-value { font-size: 22px; font-weight: 700; color: var(--primary-dark); font-variant-numeric: tabular-nums; }

  .selected-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(30,36,51,.5); backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50;
  }
  .modal-overlay.hidden { display: none; }
  .modal-box { background: var(--surface); border-radius: var(--radius-lg); padding: 26px; width: 100%; max-width: 380px; box-shadow: 0 24px 60px -16px rgba(30,36,51,.35); }
  .modal-box h2 { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="brand-badge"><img src="/logo.png" alt="ตราโรงเรียนบ้านป่าเด็ง"></div>
    <h1>BPD School Bank</h1>
  </div>
  <div class="who-wrap">
    <div class="who" id="whoBox"></div>
    <button class="link" id="changePasswordOpenBtn">🔑 เปลี่ยนรหัสผ่าน</button>
    <button class="link" id="logoutBtn">ออกจากระบบ</button>
  </div>
</header>

<div class="modal-overlay hidden" id="changePasswordModal">
  <div class="modal-box">
    <h2>เปลี่ยนรหัสผ่าน</h2>
    <label>รหัสผ่านปัจจุบัน</label>
    <input id="cpCurrent" type="password">
    <label>รหัสผ่านใหม่ (4–100 ตัวอักษร)</label>
    <input id="cpNew" type="password">
    <label>ยืนยันรหัสผ่านใหม่</label>
    <input id="cpConfirm" type="password">
    <div class="msg" id="cpMsg"></div>
    <button class="primary" id="cpSubmit">บันทึกรหัสผ่านใหม่</button>
    <button class="primary muted" id="cpCancel">ยกเลิก</button>
  </div>
</div>

<nav id="mainNav"></nav>

<main>
  <!-- BANK OPERATIONS -->
  <section class="pane" data-pane="bank">
    <div class="card">
      <h2>สถานะ Bank Session</h2>
      <div id="sessionStatus">กำลังโหลด...</div>
      <div id="sessionControls"></div>
    </div>

    <div class="card">
      <h2>ค้นหาบัญชี</h2>
      <input id="searchInput" placeholder="ชื่อ, รหัสนักเรียน หรือเลขบัญชี">
      <div id="searchResults"></div>
    </div>

    <div class="card" id="selectedAccountCard" style="display:none;">
      <div class="selected-head">
        <h2 style="margin-bottom:0;">บัญชีที่เลือก: <span id="selectedAccountLabel"></span></h2>
      </div>
      <div class="stat-tile" style="margin-bottom:6px;">
        <span class="stat-label">ยอดคงเหลือ</span>
        <span class="stat-value"><span id="selectedAccountBalance"></span> บาท</span>
      </div>

      <label>จุดทำรายการ</label>
      <select id="locationSelect"></select>

      <label>จำนวนเงิน (บาท)</label>
      <input id="amountInput" type="number" min="0" step="0.01">

      <label>หมายเหตุ</label>
      <input id="noteInput" maxlength="300">

      <div>
        <button class="primary" id="depositBtn">ฝากเงิน</button>
        <button class="primary danger" id="withdrawBtn">ถอนเงิน</button>
      </div>
      <div class="msg" id="txMsg"></div>
    </div>
  </section>

  <!-- OPEN ACCOUNT -->
  <section class="pane" data-pane="open-account">
    <div class="card">
      <h2>เปิดบัญชีใหม่</h2>
      <label>รหัสนักเรียน (ถ้ามี)</label>
      <input id="oaSchoolId">
      <label>คำนำหน้า</label>
      <input id="oaPrefix" value="เด็กชาย">
      <label>ชื่อ</label>
      <input id="oaFirstName">
      <label>นามสกุล</label>
      <input id="oaLastName">
      <label>ชั้น</label>
      <input id="oaGrade">
      <label>ห้อง</label>
      <input id="oaRoom">
      <label>ประเภทบัญชี</label>
      <select id="oaType"><option value="SAVINGS">ออมทรัพย์</option><option value="SHARE">ออมหุ้น</option></select>
      <label>ยอดเปิดบัญชี (บาท)</label>
      <input id="oaOpening" type="number" min="0" step="0.01" value="0">
      <button class="primary" id="oaSubmit">เปิดบัญชี</button>
      <div class="msg" id="oaMsg"></div>
    </div>
  </section>

  <!-- ADMIN -->
  <section class="pane" data-pane="admin">
    <div class="card">
      <h2>ผู้ใช้งาน</h2>
      <div id="userList">กำลังโหลด...</div>
    </div>
    <div class="card">
      <h2>เพิ่มผู้ใช้งาน</h2>
      <label>Username</label><input id="newUsername">
      <label>Password</label><input id="newPassword" type="password">
      <label>ชื่อที่แสดง</label><input id="newDisplayName">
      <label>Role</label>
      <select id="newRole"><option value="TELLER">TELLER</option><option value="ADMIN">ADMIN</option></select>
      <button class="primary" id="createUserBtn">สร้างผู้ใช้งาน</button>
      <div class="msg" id="createUserMsg"></div>
    </div>
  </section>
</main>

<script>
  const token = localStorage.getItem('BPD_TOKEN');
  if (!token) window.location.href = '/login.html';

  let currentUser = null;
  let permissions = {};
  let locations = [];
  let selectedAccount = null;

  function escapeHtml(v) {
    return String(v ?? '')
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;').replaceAll("'", '&#039;');
  }

  function initials(name) {
    const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return '?';
    return parts[0].slice(0, 1).toUpperCase();
  }

  function money(satang) {
    return (Number(satang || 0) / 100).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  async function api(path, options) {
    const res = await fetch(path, {
      ...options,
      headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + token, ...(options && options.headers) }
    });
    const data = await res.json().catch(() => ({ success: false, message: 'Invalid response' }));
    if (res.status === 401) {
      localStorage.removeItem('BPD_TOKEN');
      window.location.href = '/login.html';
      throw new Error('Session expired');
    }
    return data;
  }

  function hasPermission(p) {
    return currentUser && (currentUser.role === 'ADMIN' || permissions[p] === true);
  }

  const TABS = [
    { key: 'bank', label: 'ฝาก-ถอน', permission: null },
    { key: 'open-account', label: 'เปิดบัญชี', permission: 'CAN_OPEN_ACCOUNT' },
    { key: 'admin', label: 'ผู้ใช้งาน', permission: 'CAN_MANAGE_USERS' }
  ];

  function renderNav() {
    const nav = document.getElementById('mainNav');
    nav.innerHTML = '';
    TABS.forEach(function(tab, index) {
      if (tab.permission && !hasPermission(tab.permission)) return;
      const btn = document.createElement('button');
      btn.textContent = tab.label;
      btn.className = index === 0 ? 'active' : '';
      btn.onclick = function() { showPane(tab.key, btn); };
      nav.appendChild(btn);
    });
  }

  function showPane(key, btn) {
    document.querySelectorAll('.pane').forEach((p) => p.classList.toggle('active', p.dataset.pane === key));
    document.querySelectorAll('nav button').forEach((b) => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    if (key === 'admin') loadUsers();
  }

  async function init() {
    const boot = await api('/api/bootstrap');
    if (!boot.success) return;
    currentUser = boot.user;
    permissions = boot.permissions || {};

    document.getElementById('whoBox').textContent = currentUser.displayName + ' (' + currentUser.role + ')';
    renderNav();
    showPane('bank');

    await Promise.all([loadSessionStatus(), loadLocations()]);
  }

  async function loadLocations() {
    const res = await api('/api/locations');
    locations = res.locations || [];
    const select = document.getElementById('locationSelect');
    select.innerHTML = locations.map((l) => `<option value="${escapeHtml(l.locationId)}">${escapeHtml(l.name)}</option>`).join('');
  }

  async function loadSessionStatus() {
    const res = await api('/api/bank-session/active');
    const box = document.getElementById('sessionStatus');
    const controls = document.getElementById('sessionControls');
    const session = res.bankSession;

    box.innerHTML = session
      ? '<span class="badge open">เปิดอยู่</span>'
      : '<span class="badge closed">ปิดอยู่</span>';

    controls.innerHTML = '';
    if (!session && hasPermission('CAN_OPEN_BANK_SESSION')) {
      const btn = document.createElement('button');
      btn.className = 'primary'; btn.textContent = 'เปิด Bank Session';
      btn.onclick = async () => { await api('/api/bank-session/open', { method: 'POST', body: JSON.stringify({}) }); loadSessionStatus(); };
      controls.appendChild(btn);
    }
    if (session && hasPermission('CAN_CLOSE_BANK_SESSION')) {
      const btn = document.createElement('button');
      btn.className = 'primary danger'; btn.textContent = 'ปิด Bank Session';
      btn.onclick = async () => { await api('/api/bank-session/close', { method: 'POST', body: JSON.stringify({}) }); loadSessionStatus(); };
      controls.appendChild(btn);
    }
  }

  let searchTimer = null;
  document.getElementById('searchInput').addEventListener('input', function(e) {
    clearTimeout(searchTimer);
    const q = e.target.value;
    searchTimer = setTimeout(() => runSearch(q), 300);
  });

  async function runSearch(q) {
    const box = document.getElementById('searchResults');
    if (!q.trim()) { box.innerHTML = ''; return; }
    const res = await api('/api/accounts/search?q=' + encodeURIComponent(q));
    const accounts = res.accounts || [];
    box.innerHTML = accounts.length
      ? accounts.map((a, i) => `
          <div class="result-row" onclick="selectAccount(${i})">
            <div class="result-name-wrap">
              <div class="avatar">${escapeHtml(initials(a.fullName))}</div>
              <div>
                <div class="result-name">${escapeHtml(a.fullName)}</div>
                <div class="result-sub">${escapeHtml(a.accountNo)}</div>
              </div>
            </div>
            <span class="result-amount">${money(a.balance)} บ.</span>
          </div>`).join('')
      : '<p class="empty-hint">ไม่พบบัญชี</p>';
    box.dataset.accounts = JSON.stringify(accounts);
  }

  window.selectAccount = function(index) {
    const accounts = JSON.parse(document.getElementById('searchResults').dataset.accounts || '[]');
    selectedAccount = accounts[index];
    if (!selectedAccount) return;
    document.getElementById('selectedAccountCard').style.display = 'block';
    document.getElementById('selectedAccountLabel').textContent = selectedAccount.fullName + ' (' + selectedAccount.accountNo + ')';
    document.getElementById('selectedAccountBalance').textContent = money(selectedAccount.balance);
    document.getElementById('txMsg').textContent = '';
  };

  async function submitTx(type) {
    const msg = document.getElementById('txMsg');
    msg.className = 'msg';
    if (!selectedAccount) { msg.textContent = 'กรุณาเลือกบัญชี'; msg.className = 'msg error'; return; }

    const amountBaht = Number(document.getElementById('amountInput').value || 0);
    if (!amountBaht || amountBaht <= 0) { msg.textContent = 'กรุณากรอกจำนวนเงิน'; msg.className = 'msg error'; return; }

    const payload = {
      accountId: selectedAccount.accountId,
      locationId: document.getElementById('locationSelect').value,
      amountSatang: Math.round(amountBaht * 100),
      note: document.getElementById('noteInput').value,
      requestId: crypto.randomUUID()
    };

    const res = await api(type === 'DEPOSIT' ? '/api/deposit' : '/api/withdraw', { method: 'POST', body: JSON.stringify(payload) });
    if (!res.success) { msg.textContent = res.message; msg.className = 'msg error'; return; }

    msg.textContent = (type === 'DEPOSIT' ? 'ฝากเงินสำเร็จ ' : 'ถอนเงินสำเร็จ ') + money(res.amountSatang) + ' บาท';
    msg.className = 'msg success';
    selectedAccount.balance = res.balanceAfterSatang;
    document.getElementById('selectedAccountBalance').textContent = money(selectedAccount.balance);
    document.getElementById('amountInput').value = '';
  }

  document.getElementById('depositBtn').onclick = () => submitTx('DEPOSIT');
  document.getElementById('withdrawBtn').onclick = () => submitTx('WITHDRAW');

  document.getElementById('oaSubmit').onclick = async function() {
    const msg = document.getElementById('oaMsg');
    const payload = {
      schoolStudentId: document.getElementById('oaSchoolId').value,
      prefix: document.getElementById('oaPrefix').value,
      firstName: document.getElementById('oaFirstName').value,
      lastName: document.getElementById('oaLastName').value,
      grade: document.getElementById('oaGrade').value,
      room: document.getElementById('oaRoom').value,
      accountType: document.getElementById('oaType').value,
      openingBalanceSatang: Math.round(Number(document.getElementById('oaOpening').value || 0) * 100)
    };
    const res = await api('/api/accounts', { method: 'POST', body: JSON.stringify(payload) });
    msg.className = res.success ? 'msg success' : 'msg error';
    msg.textContent = res.success ? 'เปิดบัญชีสำเร็จ เลขบัญชี ' + res.accountNo : res.message;
  };

  async function loadUsers() {
    const res = await api('/api/admin/users');
    const box = document.getElementById('userList');
    if (!res.success) { box.textContent = res.message; return; }
    box.innerHTML = `<table><thead><tr><th>ชื่อ</th><th>Username</th><th>Role</th><th>สถานะ</th></tr></thead><tbody>
      ${res.users.map((u) => `<tr><td>${escapeHtml(u.displayName)}</td><td>${escapeHtml(u.username)}</td><td><span class="badge role">${escapeHtml(u.role)}</span></td><td>${u.active ? '<span class="badge open">ใช้งาน</span>' : '<span class="badge closed">ปิดใช้งาน</span>'}</td></tr>`).join('')}
    </tbody></table>`;
  }

  document.getElementById('createUserBtn').onclick = async function() {
    const msg = document.getElementById('createUserMsg');
    const payload = {
      username: document.getElementById('newUsername').value,
      password: document.getElementById('newPassword').value,
      displayName: document.getElementById('newDisplayName').value,
      role: document.getElementById('newRole').value
    };
    const res = await api('/api/admin/users', { method: 'POST', body: JSON.stringify(payload) });
    msg.className = res.success ? 'msg success' : 'msg error';
    msg.textContent = res.success ? 'สร้างผู้ใช้งานสำเร็จ' : res.message;
    if (res.success) loadUsers();
  };

  document.getElementById('logoutBtn').onclick = async function() {
    await api('/api/logout', { method: 'POST', body: JSON.stringify({}) }).catch(() => {});
    localStorage.removeItem('BPD_TOKEN');
    localStorage.removeItem('BPD_USER');
    window.location.href = '/login.html';
  };

  document.getElementById('changePasswordOpenBtn').onclick = function() {
    document.getElementById('cpCurrent').value = '';
    document.getElementById('cpNew').value = '';
    document.getElementById('cpConfirm').value = '';
    document.getElementById('cpMsg').textContent = '';
    document.getElementById('changePasswordModal').classList.remove('hidden');
  };

  document.getElementById('cpCancel').onclick = function() {
    document.getElementById('changePasswordModal').classList.add('hidden');
  };

  document.getElementById('cpSubmit').onclick = async function() {
    const msg = document.getElementById('cpMsg');
    const currentPassword = document.getElementById('cpCurrent').value;
    const newPassword = document.getElementById('cpNew').value;
    const confirmPassword = document.getElementById('cpConfirm').value;

    if (!currentPassword) { msg.className = 'msg error'; msg.textContent = 'กรุณากรอกรหัสผ่านปัจจุบัน'; return; }
    if (!newPassword || newPassword.length < 4 || newPassword.length > 100) {
      msg.className = 'msg error'; msg.textContent = 'รหัสผ่านใหม่ต้องมีความยาว 4–100 ตัวอักษร'; return;
    }
    if (newPassword !== confirmPassword) { msg.className = 'msg error'; msg.textContent = 'ยืนยันรหัสผ่านไม่ตรงกัน'; return; }
    if (newPassword === currentPassword) { msg.className = 'msg error'; msg.textContent = 'รหัสผ่านใหม่ต้องไม่เหมือนรหัสเดิม'; return; }

    const res = await api('/api/change-password', { method: 'POST', body: JSON.stringify({ currentPassword, newPassword }) });
    if (!res.success) { msg.className = 'msg error'; msg.textContent = res.message; return; }

    msg.className = 'msg success';
    msg.textContent = 'เปลี่ยนรหัสผ่านสำเร็จ';
    setTimeout(() => document.getElementById('changePasswordModal').classList.add('hidden'), 1000);
  };

  init();
</script>
</body>
</html>
