<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ - BPD School Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #0a84ff;
    --primary-dark: #0060df;
    --primary-light: #e8f2ff;
    --surface: rgba(255,255,255,.82);
    --text: #1d1d1f;
    --muted: #6e6e73;
    --border: rgba(0,0,0,.08);
    --danger: #d70015;
    --radius-lg: 18px;
    --radius-md: 10px;
    --shadow: 0 30px 70px -20px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Sarabun', 'Helvetica Neue', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: var(--text);
    background:
      radial-gradient(circle at 20% 20%, #6dd5ff 0%, transparent 55%),
      radial-gradient(circle at 85% 15%, #b990ff 0%, transparent 50%),
      radial-gradient(circle at 50% 90%, #7ec8ff 0%, transparent 55%),
      linear-gradient(135deg, #2c7bd1, #5b4bd6);
    background-attachment: fixed;
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: var(--surface);
    -webkit-backdrop-filter: saturate(180%) blur(24px);
    backdrop-filter: saturate(180%) blur(24px);
    border-radius: var(--radius-lg);
    padding: 36px 32px 30px;
    box-shadow: var(--shadow);
    border: 1px solid rgba(255,255,255,.5);
    text-align: center;
  }
  .logo-badge {
    width: 76px; height: 76px; border-radius: 20px;
    background: #fff; display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px; padding: 8px;
    box-shadow: 0 10px 24px -8px rgba(0,0,0,.3);
  }
  .logo-badge img { width: 100%; height: 100%; object-fit: contain; }
  h1 { font-size: 18px; font-weight: 600; margin-bottom: 3px; }
  p.sub { color: var(--muted); font-size: 12.5px; margin-bottom: 26px; }
  label { display: block; text-align: left; font-size: 12px; font-weight: 500; color: var(--muted); margin: 14px 0 5px; }
  input {
    width: 100%; padding: 10px 13px; border: 1px solid var(--border);
    border-radius: var(--radius-md); font-size: 14px; font-family: inherit; background: rgba(255,255,255,.7);
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus {
    outline: none; border-color: var(--primary);
    box-shadow: 0 0 0 3.5px var(--primary-light);
    background: #fff;
  }
  button {
    width: 100%; margin-top: 22px; padding: 11px; border: none;
    border-radius: var(--radius-md);
    background: var(--primary);
    color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
    transition: background .12s, transform .06s;
    box-shadow: 0 1px 2px rgba(0,0,0,.1);
  }
  button:hover:not(:disabled) { background: var(--primary-dark); }
  button:active:not(:disabled) { transform: scale(.98); }
  button:disabled { opacity: .6; cursor: default; box-shadow: none; }
  .error {
    color: var(--danger); font-size: 12.5px; margin-top: 12px; min-height: 18px;
    background: #ffebe9; border-radius: 8px; padding: 0;
  }
  .error:not(:empty) { padding: 7px 11px; }
  .footnote { text-align: center; font-size: 11.5px; color: var(--muted); margin-top: 20px; }
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <div class="logo-badge">
      <img src="/logo.png" alt="ตราโรงเรียนบ้านป่าเด็ง">
    </div>
    <h1>BPD School Bank</h1>
    <p class="sub">เข้าสู่ระบบธนาคารโรงเรียน</p>

    <label for="username">ชื่อผู้ใช้งาน</label>
    <input id="username" autocomplete="username" required>

    <label for="password">รหัสผ่าน</label>
    <input id="password" type="password" autocomplete="current-password" required>

    <div class="error" id="errorBox"></div>
    <button type="submit" id="submitBtn">เข้าสู่ระบบ</button>
    <p class="footnote">โรงเรียนบ้านป่าเด็ง</p>
  </form>

<script>
  document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const errorBox = document.getElementById('errorBox');
    errorBox.textContent = '';
    btn.disabled = true;
    btn.textContent = 'กำลังเข้าสู่ระบบ...';

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();

      if (!data.success) {
        errorBox.textContent = data.message || 'เข้าสู่ระบบไม่สำเร็จ';
        return;
      }

      localStorage.setItem('BPD_TOKEN', data.token);
      localStorage.setItem('BPD_USER', JSON.stringify(data.user));
      window.location.href = '/app.html';
    } catch (err) {
      errorBox.textContent = 'เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ กรุณาลองใหม่';
    } finally {
      btn.disabled = false;
      btn.textContent = 'เข้าสู่ระบบ';
    }
  });
</script>
</body>
</html>
